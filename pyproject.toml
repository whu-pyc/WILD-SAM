[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wild-sam"
version = "0.1.0"
description = "WILD-SAM network for segmentation of wrapped InSAR interferograms"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy>=1.21"]

[tool.setuptools]
license-files = ["licenses/segment-anything-LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["wild_sam", "wild_sam.*"]
